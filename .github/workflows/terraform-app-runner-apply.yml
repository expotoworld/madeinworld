name: Terraform Apply (App Runner)

on:
  push:
    branches: ["main"]
    paths:
      - 'terraform/app_runner/**'
      - '.github/workflows/terraform-app-runner-apply.yml'
  workflow_dispatch:


concurrency:
  group: terraform-app-runner-apply
  cancel-in-progress: true

permissions:
  id-token: write
  contents: read

jobs:
  apply:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./terraform/app_runner
    env:
      TF_IN_AUTOMATION: true
      TF_INPUT: false
      TF_VAR_alarm_notification_email: "expotobsrl@gmail.com"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.IAM_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}


      - name: Export secrets to env
        shell: bash
        run: |
          echo "IAM_ROLE_ARN=${{ secrets.IAM_ROLE_ARN }}" >> $GITHUB_ENV
          echo "AWS_REGION=${{ secrets.AWS_REGION }}" >> $GITHUB_ENV
          echo "TF_STATE_BUCKET=${{ secrets.TF_STATE_BUCKET }}" >> $GITHUB_ENV
          echo "TF_LOCK_TABLE=${{ secrets.TF_LOCK_TABLE }}" >> $GITHUB_ENV
          echo "TF_VAR_aws_region=${{ secrets.AWS_REGION }}" >> $GITHUB_ENV
          echo "TF_VAR_project=madeinworld" >> $GITHUB_ENV
          echo "TF_VAR_neon_db_host=${{ secrets.NEON_DB_HOST }}" >> $GITHUB_ENV
          echo "TF_VAR_neon_db_user=${{ secrets.NEON_DB_USER }}" >> $GITHUB_ENV
          echo "TF_VAR_neon_db_name=${{ secrets.NEON_DB_NAME }}" >> $GITHUB_ENV
          echo "TF_VAR_secret_arn_db_password=${{ secrets.TF_VAR_SECRET_ARN_DB_PASSWORD || secrets.SECRET_ARN_DB_PASSWORD || secrets.DB_SECRET_ARN }}" >> $GITHUB_ENV
          echo "TF_VAR_secret_arn_jwt_secret=${{ secrets.SECRET_ARN_JWT_SECRET || secrets.JWT_SECRET_ARN }}" >> $GITHUB_ENV
          echo "TF_VAR_ses_from_email=${{ secrets.SES_FROM_EMAIL }}" >> $GITHUB_ENV
          # Force a safe daily schedule regardless of org/repo secrets to avoid accidental cost spikes
          echo "TF_VAR_canary_schedule_expression=cron(0 0 * * ? *)" >> $GITHUB_ENV
          echo "TF_VAR_create_ce_anomaly_monitor=false" >> $GITHUB_ENV
          # Disable the canary IAM policy attachments by default
          echo "TF_VAR_enable_auth_ready_canary=false" >> $GITHUB_ENV
          echo "TF_VAR_enable_ce_anomaly_subscription=false" >> $GITHUB_ENV






      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.12.2

      - name: Terraform Init (S3 backend)
        env:
          TF_STATE_BUCKET: ${{ secrets.TF_STATE_BUCKET }}
          TF_LOCK_TABLE: ${{ secrets.TF_LOCK_TABLE }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
        run: |
          terraform init -input=false -migrate-state \
            -backend-config="bucket=${TF_STATE_BUCKET}" \
            -backend-config="key=app_runner/terraform.tfstate" \
            -backend-config="region=${AWS_REGION}" \
            -backend-config="dynamodb_table=${TF_LOCK_TABLE}"

      - name: Terraform Validate
        run: terraform validate

      - name: Ensure required ECR images exist (latest tag)
        env:
          AWS_REGION: ${{ secrets.AWS_REGION }}
        shell: bash
        run: |
          set -e
          REPOS=(
            "madeinworld/auth-service"
            "madeinworld/catalog-service"
            "madeinworld/order-service"
            "madeinworld/user-service"
            "madeinworld/ebook-service"
          )
          for REPO in "${REPOS[@]}"; do
            echo "Ensuring ECR image exists for $REPO:latest"
            for i in {1..60}; do
              if aws ecr describe-images --repository-name "$REPO" --image-ids imageTag=latest --query 'imageDetails[0].imageDigest' --output text >/dev/null 2>&1; then
                echo "Found latest for $REPO"
                break
              fi
              echo "latest not found for $REPO yet; waiting 10s (attempt $i/60)"
              sleep 10
            done
          done

      - name: Detect existing CE Service monitor (sets TF_VAR_ce_monitor_arn if found)
        shell: bash
        run: |
          set -e
          ARN=$(aws ce get-anomaly-monitors --max-results 100 --region us-east-1 \
            --query "AnomalyMonitors[?MonitorType=='DIMENSIONAL' && MonitorDimension=='SERVICE'].MonitorArn | [0]" \
            --output text || true)
          echo "Get monitors returned: $ARN"
          if [ -n "$ARN" ] && [ "$ARN" != "None" ]; then
            echo "Found existing CE SERVICE monitor: $ARN"
            echo "TF_VAR_ce_monitor_arn=$ARN" >> $GITHUB_ENV
          else
            echo "No existing CE SERVICE monitor found; Terraform will NOT create one by default."
            echo "TF_VAR_create_ce_anomaly_monitor=false" >> $GITHUB_ENV

          fi

      - name: Remove CE subscription from state (best effort)
        run: |
          terraform state rm 'aws_ce_anomaly_subscription.cloudwatch_alerts[0]' || true

      - name: Terraform Plan
        run: terraform plan -input=false -no-color -parallelism=1 -lock-timeout=5m

      - name: Terraform Apply (all resources)
        run: |
          terraform apply -input=false -auto-approve -no-color -parallelism=1 -lock-timeout=5m

      - name: Set CloudWatch log retention for App Runner groups
        if: success()
        env:
          AWS_REGION: ${{ secrets.AWS_REGION }}
        run: |
          set -e
          echo "Setting retention to 14 days for App Runner log groups"
          groups=$(aws logs describe-log-groups --log-group-name-prefix "/aws/apprunner/madeinworld-" --query 'logGroups[].logGroupName' --output text)
          if [ -z "$groups" ]; then
            echo "No matching App Runner log groups found" >&2
            exit 1
          fi
          for g in $groups; do
            echo "Applying retention on $g"
            aws logs put-retention-policy --log-group-name "$g" --retention-in-days 14
          done
