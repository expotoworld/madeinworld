name: Terraform Apply (App Runner)

on:
  push:
    branches: ["main"]
    paths:
      - 'terraform/app_runner/**'
      - '.github/workflows/terraform-app-runner-apply.yml'
  workflow_dispatch:


concurrency:
  group: terraform-app-runner-apply
  cancel-in-progress: true

permissions:
  id-token: write
  contents: read

jobs:
  apply:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./terraform/app_runner
    env:
      TF_IN_AUTOMATION: true
      TF_INPUT: false
      TF_VAR_alarm_notification_email: "expotobsrl@gmail.com"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.IAM_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}


      - name: Export secrets to env
        shell: bash
        run: |
          echo "IAM_ROLE_ARN=${{ secrets.IAM_ROLE_ARN }}" >> $GITHUB_ENV
          echo "AWS_REGION=${{ secrets.AWS_REGION }}" >> $GITHUB_ENV
          echo "TF_STATE_BUCKET=${{ secrets.TF_STATE_BUCKET }}" >> $GITHUB_ENV
          echo "TF_LOCK_TABLE=${{ secrets.TF_LOCK_TABLE }}" >> $GITHUB_ENV
          echo "TF_VAR_aws_region=${{ secrets.AWS_REGION }}" >> $GITHUB_ENV
          echo "TF_VAR_project=madeinworld" >> $GITHUB_ENV
          echo "TF_VAR_neon_db_host=${{ secrets.NEON_DB_HOST }}" >> $GITHUB_ENV
          echo "TF_VAR_neon_db_user=${{ secrets.NEON_DB_USER }}" >> $GITHUB_ENV
          echo "TF_VAR_neon_db_name=${{ secrets.NEON_DB_NAME }}" >> $GITHUB_ENV
          echo "TF_VAR_secret_arn_db_password=${{ secrets.TF_VAR_SECRET_ARN_DB_PASSWORD || secrets.SECRET_ARN_DB_PASSWORD || secrets.DB_SECRET_ARN }}" >> $GITHUB_ENV
          echo "TF_VAR_secret_arn_jwt_secret=${{ secrets.SECRET_ARN_JWT_SECRET || secrets.JWT_SECRET_ARN }}" >> $GITHUB_ENV
          echo "TF_VAR_secret_arn_ses_user=${{ secrets.SECRET_ARN_SES_USER || secrets.SES_SMTP_USER_ARN }}" >> $GITHUB_ENV
          echo "TF_VAR_secret_arn_ses_pass=${{ secrets.SECRET_ARN_SES_PASS || secrets.SES_SMTP_PASS_ARN }}" >> $GITHUB_ENV
          echo "TF_VAR_ses_from_email=${{ secrets.SES_FROM_EMAIL }}" >> $GITHUB_ENV
          echo "TF_VAR_canary_schedule_expression=${{ secrets.CANARY_SCHEDULE_EXPRESSION || 'cron(0 0 * * ? *)' }}" >> $GITHUB_ENV






      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.12.2

      - name: Terraform Init (S3 backend)
        env:
          TF_STATE_BUCKET: ${{ secrets.TF_STATE_BUCKET }}
          TF_LOCK_TABLE: ${{ secrets.TF_LOCK_TABLE }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
        run: |
          terraform init -input=false -migrate-state \
            -backend-config="bucket=${TF_STATE_BUCKET}" \
            -backend-config="key=app_runner/terraform.tfstate" \
            -backend-config="region=${AWS_REGION}" \
            -backend-config="dynamodb_table=${TF_LOCK_TABLE}"

      - name: Terraform Validate
        run: terraform validate



      - name: Terraform Plan
        run: terraform plan -input=false -no-color -parallelism=1 -lock-timeout=5m

      - name: "Terraform Apply (App Runner: auth-service)"
        run: |
          terraform apply -input=false -auto-approve -no-color -parallelism=1 -lock-timeout=5m -target='aws_apprunner_service.main_services["auth-service"]'

      - name: "Terraform Apply (App Runner: catalog-service)"
        run: |
          terraform apply -input=false -auto-approve -no-color -parallelism=1 -lock-timeout=5m -target='aws_apprunner_service.main_services["catalog-service"]'

      - name: "Terraform Apply (App Runner: order-service)"
        run: |
          terraform apply -input=false -auto-approve -no-color -parallelism=1 -lock-timeout=5m -target='aws_apprunner_service.main_services["order-service"]'

      - name: "Terraform Apply (App Runner: user-service)"
        run: |
          terraform apply -input=false -auto-approve -no-color -parallelism=1 -lock-timeout=5m -target='aws_apprunner_service.main_services["user-service"]'

      - name: "Terraform Apply (remaining resources)"
        run: |
          terraform apply -input=false -auto-approve -no-color -parallelism=1 -lock-timeout=5m

      - name: Set CloudWatch log retention for App Runner groups
        if: success()
        env:
          AWS_REGION: ${{ secrets.AWS_REGION }}
        run: |
          set -e
          echo "Setting retention to 14 days for App Runner log groups"
          groups=$(aws logs describe-log-groups --log-group-name-prefix "/aws/apprunner/madeinworld-" --query 'logGroups[].logGroupName' --output text || true)
          for g in $groups; do
            echo "Applying retention on $g"
            aws logs put-retention-policy --log-group-name "$g" --retention-in-days 14 || true
          done
