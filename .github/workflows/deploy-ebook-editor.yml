name: Deploy Ebook Editor (S3/CloudFront)

on:
  push:
    branches: ["main"]
    paths:
      - 'ebook-editor/**'
      - '.github/workflows/deploy-ebook-editor.yml'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      EBOOK_EDITOR_BUCKET: ${{ secrets.EBOOK_EDITOR_BUCKET }}
      CLOUDFRONT_DISTRIBUTION_ID: ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'ebook-editor/package-lock.json'

      - name: Install deps
        working-directory: ./ebook-editor
        run: npm ci || npm install

      - name: Build
        working-directory: ./ebook-editor
        run: npm run build

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.IAM_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Sync assets (long cache)
        env:
          BUCKET: ${{ env.EBOOK_EDITOR_BUCKET != '' && env.EBOOK_EDITOR_BUCKET || 'madeinworld-ebook-editor-site-eu-central-1' }}
        run: |
          aws s3 sync ./ebook-editor/dist/assets s3://$BUCKET/assets/ --delete --cache-control "public, max-age=31536000, immutable"

      - name: Upload index.html (no cache)
        env:
          BUCKET: ${{ env.EBOOK_EDITOR_BUCKET != '' && env.EBOOK_EDITOR_BUCKET || 'madeinworld-ebook-editor-site-eu-central-1' }}
        run: |
          aws s3 cp ./ebook-editor/dist/index.html s3://$BUCKET/index.html --cache-control "no-cache, no-store, must-revalidate" --content-type "text/html"

      - name: Invalidate CloudFront (if configured)
        if: ${{ env.CLOUDFRONT_DISTRIBUTION_ID != '' }}
        env:
          DIST_ID: ${{ env.CLOUDFRONT_DISTRIBUTION_ID }}
        run: |
          aws cloudfront create-invalidation --distribution-id "$DIST_ID" --paths "/index.html" "/"
